name: Publish multi-arch manifest
description: Create a multi-arch manifest from per-architecture images and optionally sign it

inputs:
  architectures:
    description: Architectures (JSON array, e.g., '["amd64", "aarch64"]')
    required: true
  container-registry:
    description: Container registry (e.g., "ghcr.io")
    required: false
    default: "ghcr.io"
  container-registry-password:
    description: Password for container registry (use secrets.GITHUB_TOKEN for GHCR)
    required: true
  container-registry-username:
    description: Username for container registry (defaults to repository owner)
    required: false
    default: ${{ github.repository_owner }}
  cosign:
    description: Whether to sign the manifest with Cosign
    required: false
    default: "true"
  image-name:
    description: Image name without a tag (e.g., "base-python")
    required: true
  image-tags:
    description: Image tags, one per line (first tag is the primary tag used for per-arch image lookup)
    required: true
  registry-prefix:
    description: Registry and namespace prefix (e.g., "ghcr.io/owner")
    required: false
    default: ghcr.io/${{ github.repository_owner }}
  skip-existing:
    description: Skip publishing all tags and signing if this manifest tag already exists (empty disables the check)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Login to container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.container-registry }}
        username: ${{ inputs.container-registry-username }}
        password: ${{ inputs.container-registry-password }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Decide whether to publish
      id: publish
      shell: bash
      env:
        IMAGE: ${{ inputs.registry-prefix }}/${{ inputs.image-name }}
        SKIP_EXISTING: ${{ inputs.skip-existing }}
      run: |
        if [[ -z "${SKIP_EXISTING}" ]]; then
          echo "push=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        image_ref="${IMAGE}:${SKIP_EXISTING}"

        if result=$(docker buildx imagetools inspect "${image_ref}" 2>&1); then
          echo "push=false" >> "$GITHUB_OUTPUT"
        elif [[ "${result}" == *"${image_ref}: not found"* || "${result}" == *"manifest unknown"* || "${result}" == *"MANIFEST_UNKNOWN"* ]]; then
          echo "push=true" >> "$GITHUB_OUTPUT"
        else
          printf '%s\n' "${result}" >&2
          echo "::error::Could not check whether ${image_ref} already exists"
          exit 1
        fi

    - name: Warn about skipped publishing
      if: steps.publish.outputs.push == 'false'
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.registry-prefix }}/${{ inputs.image-name }}:${{ inputs.skip-existing }}
      run: |
        echo "::warning::Manifest ${IMAGE_REF} was not re-published because the specified tag already exists. Bump the version to publish these changes."

    - name: Install Cosign
      if: steps.publish.outputs.push == 'true' && inputs.cosign == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Create multi-arch manifest and sign it
      if: steps.publish.outputs.push == 'true'
      shell: bash
      env:
        ARCHITECTURES: ${{ inputs.architectures }}
        REGISTRY_PREFIX: ${{ inputs.registry-prefix }}
        IMAGE_NAME: ${{ inputs.image-name }}
        IMAGE_TAGS: ${{ inputs.image-tags }}
        COSIGN: ${{ inputs.cosign }}
      run: |
        image_tags=()
        while IFS= read -r tag; do
          [[ -n "$tag" ]] && image_tags+=("${tag}")
        done <<< "${IMAGE_TAGS}"

        source_images=()
        for arch in $(jq -r '.[]' <<< "${ARCHITECTURES}"); do
          source_images+=("${REGISTRY_PREFIX}/${arch}-${IMAGE_NAME}:${image_tags[0]}")
        done

        tags=()
        for tag in "${image_tags[@]}"; do
          tags+=("${REGISTRY_PREFIX}/${IMAGE_NAME}:${tag}")
        done

        tag_args=()
        for tag in "${tags[@]}"; do
          tag_args+=("--tag" "${tag}")
        done

        metadata_file="$(mktemp)"

        docker buildx imagetools create \
          --metadata-file "${metadata_file}" \
          "${tag_args[@]}" \
          "${source_images[@]}"

        if [[ "${COSIGN}" == "true" ]]; then
          digest="$(jq -r '.["containerimage.descriptor"].digest' "${metadata_file}")"
          cosign sign --yes "${REGISTRY_PREFIX}/${IMAGE_NAME}@${digest}"
        fi
