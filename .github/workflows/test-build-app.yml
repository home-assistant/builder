name: Build test app

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean
    outputs:
      architectures:
        value: ${{ jobs.prepare.outputs.architectures }}
      image_name:
        value: ${{ jobs.prepare.outputs.image_name }}
      registry_prefix:
        value: ${{ jobs.prepare.outputs.registry_prefix }}
      version:
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    if: github.repository == 'home-assistant/builder'
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
      moving_tag: ${{ steps.normalize.outputs.moving_tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@a7c616ce81ccda50150bf1595786c71b1883fabb # master
        with:
          path: ./${{ inputs.app }}

      - name: Normalize app information
        id: normalize
        env:
          IMAGE: ${{ fromJSON(steps.info.outputs.image) }}
          VERSION: ${{ fromJSON(steps.info.outputs.version) }}
          NAME: ${{ fromJSON(steps.info.outputs.name) }}
          DESCRIPTION: ${{ fromJSON(steps.info.outputs.description) }}
          URL: ${{ fromJSON(steps.info.outputs.url) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          moving_tag=latest
          if [[ -n "$PR_NUMBER" ]]; then
            VERSION="${VERSION}-pr-${PR_NUMBER}"
            moving_tag="pr-${PR_NUMBER}"
          fi
          {
            echo "moving_tag=${moving_tag}"
            echo "image_name=${IMAGE##*/}"
            echo "registry_prefix=${IMAGE%/*}"
            echo "version=${VERSION}"
            echo "name=${NAME}"
            echo "description=${DESCRIPTION}"
            if [[ -n "$URL" ]]; then
              echo "url=${URL}"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: ./actions/prepare-multi-arch-matrix
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: ./actions/build-image
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./${{ inputs.app }}
          cache-gha-scope: ${{ inputs.app }}
          cache-image-tag: ${{ needs.prepare.outputs.moving_tag }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.moving_tag }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ inputs.publish }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish multi-arch manifest
        uses: ./actions/publish-multi-arch-manifest
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.moving_tag }}
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}

      - name: Verify manifest signature
        uses: ./actions/cosign-verify
        with:
          image: ${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.version }}
          cosign-identity: ^https://github.com/home-assistant/builder/.*
          cosign-issuer: https://token.actions.githubusercontent.com

      - name: Verify manifest architectures
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REF" --raw > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
